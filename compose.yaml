name: remote-infra-stack

x-langfuse-environment: &langfuse-environment
  DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:?set in .env}:${LANGFUSE_POSTGRES_PASSWORD:?set in .env}@langfuse-postgres:5432/${LANGFUSE_POSTGRES_DB:?set in .env}
  SALT: ${LANGFUSE_SALT:?set in .env}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set in .env}
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:?set in .env}
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set in .env}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?set in .env}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:?set in .env}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:?set in .env}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:?set in .env}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:?set in .env}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  TELEMETRY_ENABLED: "false"

services:
  app-postgres:
    profiles: [core]
    image: ${APP_POSTGRES_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER:?set in .env}
      POSTGRES_DB: ${APP_POSTGRES_DB:?set in .env}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?set in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: ${APP_POSTGRES_MEMORY:-1g}
    networks: [infra]

  app-redis:
    profiles: [core]
    image: ${APP_REDIS_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      APP_REDIS_PASSWORD: ${APP_REDIS_PASSWORD:?set in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$$APP_REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - app_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$APP_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: ${APP_REDIS_MEMORY:-512m}
    networks: [infra]

  chroma:
    profiles: [vector]
    image: ${CHROMA_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      CHROMA_PERSIST_PATH: /data
      CHROMA_ALLOW_RESET: "false"
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD-SHELL", "exec bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: ${CHROMA_MEMORY:-4g}
    networks: [infra]

  chroma-admin:
    profiles: [vector]
    image: remote-infra-stack/chromadb-admin:efe867c86c78
    build:
      context: .
      dockerfile: images/chromadb-admin/Dockerfile
      args:
        NODE_IMAGE: ${CHROMA_ADMIN_NODE_IMAGE:?set in versions.env}
        NPM_VERSION: ${CHROMA_ADMIN_NPM_VERSION:?set in versions.env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18001:3001"
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    mem_limit: ${CHROMA_ADMIN_MEMORY:-512m}
    networks: [infra]

  dynamodb-local:
    profiles: [dynamodb]
    image: ${DYNAMODB_LOCAL_IMAGE:?set in versions.env}
    user: root
    restart: unless-stopped
    working_dir: /home/dynamodblocal
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    ports:
      - "127.0.0.1:18002:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL", "exec bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: ${DYNAMODB_MEMORY:-1g}
    networks: [infra]

  dynamodb-admin:
    profiles: [dynamodb]
    image: ${DYNAMODB_ADMIN_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8001"
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "127.0.0.1:18003:8001"
    depends_on:
      dynamodb-local:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    mem_limit: ${DYNAMODB_ADMIN_MEMORY:-512m}
    networks: [infra]

  ollama-llm:
    profiles: [inference]
    image: ${OLLAMA_IMAGE:?set in versions.env}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/remote-infra/bootstrap.sh"]
    environment:
      OLLAMA_MODEL: ${OLLAMA_LLM_MODEL:?set in versions.env}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    ports:
      - "127.0.0.1:11440:11434"
    volumes:
      - ollama_llm_data:/root/.ollama
      - ./config/ollama/bootstrap.sh:/opt/remote-infra/bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/remote-infra-model-ready && OLLAMA_HOST=127.0.0.1:11434 /bin/ollama show \"$$OLLAMA_MODEL\" >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90m
    mem_limit: ${OLLAMA_LLM_MEMORY:-14g}
    networks: [infra]

  ollama-embedding:
    profiles: [inference]
    image: ${OLLAMA_IMAGE:?set in versions.env}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/remote-infra/bootstrap.sh"]
    environment:
      OLLAMA_MODEL: ${OLLAMA_EMBEDDING_MODEL:?set in versions.env}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    ports:
      - "127.0.0.1:11441:11434"
    volumes:
      - ollama_embedding_data:/root/.ollama
      - ./config/ollama/bootstrap.sh:/opt/remote-infra/bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/remote-infra-model-ready && OLLAMA_HOST=127.0.0.1:11434 /bin/ollama show \"$$OLLAMA_MODEL\" >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90m
    mem_limit: ${OLLAMA_EMBEDDING_MEMORY:-2g}
    networks: [infra]

  opensearch:
    profiles: [search]
    image: ${OPENSEARCH_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:?set in .env}
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set in .env}
      REMOTE_INFRA_OPENSEARCH_CONFIG_B64: ${STACK_OPENSEARCH_CONFIG_B64:?verified OpenSearch config unavailable}
      REMOTE_INFRA_OPENSEARCH_ENTRYPOINT_B64: ${STACK_OPENSEARCH_ENTRYPOINT_B64:?verified OpenSearch entrypoint unavailable}
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    entrypoint:
      - /bin/bash
      - -ceu
      - |
        set -o pipefail
        printf '%s' "$$REMOTE_INFRA_OPENSEARCH_ENTRYPOINT_B64" | base64 --decode | /bin/bash -s -- "$$@"
      - --
    command: ["opensearch"]
    healthcheck:
      test: ["CMD-SHELL", "curl -ksS -u admin:\"$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" https://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: ${OPENSEARCH_MEMORY:-6g}
    networks: [infra]

  opensearch-dashboards:
    profiles: [search]
    image: ${OPENSEARCH_DASHBOARDS_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: https://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set in .env}
      OPENSEARCH_SSL_VERIFICATIONMODE: none
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u admin:\"$$OPENSEARCH_PASSWORD\" http://127.0.0.1:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    mem_limit: ${OPENSEARCH_DASHBOARDS_MEMORY:-1g}
    networks: [infra]

  langfuse-postgres:
    profiles: [observability]
    image: ${LANGFUSE_POSTGRES_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:?set in .env}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:?set in .env}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?set in .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: ${LANGFUSE_POSTGRES_MEMORY:-2g}
    networks: [infra]

  langfuse-redis:
    profiles: [observability]
    image: ${LANGFUSE_REDIS_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      LANGFUSE_REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:?set in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$$LANGFUSE_REDIS_PASSWORD\""]
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$LANGFUSE_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: ${LANGFUSE_REDIS_MEMORY:-512m}
    networks: [infra]

  clickhouse:
    profiles: [observability]
    image: ${CLICKHOUSE_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:?set in .env}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set in .env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    mem_limit: ${CLICKHOUSE_MEMORY:-6g}
    networks: [infra]

  minio:
    profiles: [observability]
    image: ${MINIO_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:?set in .env}
    entrypoint: ["sh", "-c"]
    command: ['mkdir -p /data/langfuse && exec minio server --address ":9000" --console-address ":9001" /data']
    ports:
      - "127.0.0.1:9090:9000"
      - "127.0.0.1:9091:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: ${MINIO_MEMORY:-1g}
    networks: [infra]

  langfuse-worker:
    profiles: [observability]
    image: ${LANGFUSE_WORKER_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      <<: *langfuse-environment
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://' + process.env.HOSTNAME + ':3030/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
    mem_limit: ${LANGFUSE_WORKER_MEMORY:-2g}
    networks: [infra]

  langfuse-web:
    profiles: [observability]
    image: ${LANGFUSE_WEB_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      <<: *langfuse-environment
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://' + process.env.HOSTNAME + ':3000/api/public/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
    mem_limit: ${LANGFUSE_WEB_MEMORY:-2g}
    networks: [infra]

  pgadmin:
    profiles: [tools]
    image: ${PGADMIN_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?set in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set in .env}
      PGADMIN_LISTEN_PORT: "5050"
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      app-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5050/misc/ping >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${PGADMIN_MEMORY:-512m}
    networks: [infra]

  redisinsight:
    profiles: [tools]
    image: ${REDISINSIGHT_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      RI_APP_PORT: "5540"
      RI_ENCRYPTION_KEY: ${REDISINSIGHT_ENCRYPTION_KEY:?set in .env}
      RI_REDIS_HOST: app-redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_PASSWORD: ${APP_REDIS_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      app-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5540/api/health/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${REDISINSIGHT_MEMORY:-512m}
    networks: [infra]

networks:
  infra:
    name: remote-infra-stack-infra

volumes:
  app_postgres_data:
    name: remote-infra-stack-app-postgres-data
  app_redis_data:
    name: remote-infra-stack-app-redis-data
  chroma_data:
    name: remote-infra-stack-chroma-data
  dynamodb_data:
    name: remote-infra-stack-dynamodb-data
  ollama_llm_data:
    name: remote-infra-stack-ollama-llm-data
  ollama_embedding_data:
    name: remote-infra-stack-ollama-embedding-data
  opensearch_data:
    name: remote-infra-stack-opensearch-data
  langfuse_postgres_data:
    name: remote-infra-stack-langfuse-postgres-data
  langfuse_redis_data:
    name: remote-infra-stack-langfuse-redis-data
  clickhouse_data:
    name: remote-infra-stack-clickhouse-data
  clickhouse_logs:
    name: remote-infra-stack-clickhouse-logs
  minio_data:
    name: remote-infra-stack-minio-data
  pgadmin_data:
    name: remote-infra-stack-pgadmin-data
  redisinsight_data:
    name: remote-infra-stack-redisinsight-data
